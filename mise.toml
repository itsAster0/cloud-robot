[tools]
rust = "1.98.0"
go = "1.26.7"
node = "26.8.1"
pnpm = "11.24.0"

[env]
GOCACHE = "/private/tmp/cloud-robot-go-cache"
AWS_REGION = "us-east-1"
AWS_ACCESS_KEY_ID = "test"
AWS_SECRET_ACCESS_KEY = "test"
AWS_ENDPOINT_URL = "http://localhost:4566"
S3_SCRIPTS_BUCKET = "robot-arena-scripts"
DYNAMODB_MATCHES_TABLE = "robot-arena-matches"
SQS_MATCH_JOBS_QUEUE = "robot-arena-match-jobs"
WORKOS_CLIENT_ID = "client_01M1EN6565YSSYPRPKA8A5R5MX"
VITE_WORKOS_CLIENT_ID = "client_01M1EN6565YSSYPRPKA8A5R5MX"
AUTH_REQUIRED = "true"
LOCAL_AUTH_ENABLED = "true"
LOCAL_AUTH_SECRET = "local-session-secret-change-me"
API_ADDR = ":8080"
BOX_PROVISIONER_URL = "http://localhost:8090"
PROVISIONER_TOKEN = "local-review-token-change-me"
ROBOT_AGENT_BASE_URL = "ws://host.docker.internal:8080"
SSH_PORT_MIN = "22000"
SSH_PORT_COUNT = "1000"
EXPECTED_BOX_COUNT = "2"
QUEUE_CONNECT_GRACE_SECONDS = "30"
QUEUE_BOT_FILL_SECONDS = "45"
MAINTENANCE_MODE = "false"

[tasks.install]
description = "Install frontend dependencies"
run = "pnpm install"

[tasks."dev:cloud"]
description = "Start Floci"
run = "docker compose up -d floci"

[tasks."dev:api"]
description = "Run Go API and match worker"
run = "go run ./cmd/server"

[tasks."dev:web"]
description = "Run Svelte development server"
run = "pnpm --dir apps/web dev"

[tasks.check]
description = "Run all static checks"
run = [
  "pnpm --dir apps/web check",
  "cargo fmt --check --manifest-path crates/arena-engine/Cargo.toml",
  "cargo clippy --locked --manifest-path crates/arena-engine/Cargo.toml --all-targets -- -D warnings",
  "go vet ./...",
]

[tasks.test]
description = "Run all tests"
run = [
  "pnpm --dir apps/web test",
  "cargo test --locked --manifest-path crates/arena-engine/Cargo.toml",
  "cargo build --locked --manifest-path crates/arena-engine/Cargo.toml",
  "go test ./...",
]

[tasks.build]
description = "Build frontend and backend"
run = [
  "pnpm --dir apps/web build",
  "cargo build --release --locked --manifest-path crates/arena-engine/Cargo.toml",
  "go build -o bin/robot-arena ./cmd/server",
]

[tasks.demo]
description = "Build and start complete review stack"
run = [
  "docker build -f infra/robot-box/Dockerfile -t cloud-robot-box:local .",
  "docker compose up --build",
]

[tasks."demo:stop"]
description = "Stop stack and robot boxes; volumes and workspaces are kept"
run = [
  "sh -c 'ids=$(docker ps -q --filter label=robot-arena.box=true); [ -n \"$ids\" ] && docker stop $ids || true'",
  "docker compose down",
]

[tasks."demo:start"]
description = "Restart stack; boxes are rediscovered on next sign-in"
run = "docker compose up -d"

[tasks."box:build"]
description = "Build dynamic SSH robot box image"
run = "docker build -f infra/robot-box/Dockerfile -t cloud-robot-box:local ."

[tasks."box:stop"]
description = "Stop running robot boxes without deleting workspaces"
run = "sh -c 'ids=$(docker ps -q --filter label=robot-arena.box=true); [ -n \"$ids\" ] && docker stop $ids || true'"

[tasks."vps:doctor"]
description = "Run read-only VPS capability checks over SSH"
run = "./scripts/remote-doctor.sh"

[tasks."v4:build"]
description = "Build the Rust arena worker"
run = "cargo build --release --locked --manifest-path crates/arena-engine/Cargo.toml"

[tasks."v4:test"]
description = "Test Rust game rules and protocol"
run = "cargo test --locked --manifest-path crates/arena-engine/Cargo.toml"

[tasks."v4:bench"]
description = "Measure 256-robot simulation performance"
depends = ["v4:build"]
run = "crates/arena-engine/target/release/arena-engine benchmark 256 1000"

[tasks."v4:load"]
description = "Run real WebSocket load checks (ARENA_LOAD_ROBOTS defaults to 16)"
depends = ["v4:build"]
run = 'ARENA_LOAD_ROBOTS=${ARENA_LOAD_ROBOTS:-16} go test ./internal/api -run TestV4NetworkLoad -count=1 -v -timeout=60m'

[tasks."v4:smoke"]
description = "Verify two real SSH boxes, Lua agents and Floci replay storage; requires running Compose stack"
depends = ["v4:build", "box:build"]
run = "ARENA_DOCKER_SMOKE=1 go test ./internal/api -run TestV4DockerSSHSmoke -count=1 -v -timeout=4m"

[tasks."sdk:test"]
description = "Run Lua SDK helper tests under the box image's Lua 5.4"
depends = ["box:build"]
run = "docker run --rm --entrypoint lua5.4 -v \"$PWD/sdk:/src/sdk:ro\" -w /src cloud-robot-box:local sdk/lua/arena_test.lua"

[tasks."v4:behaviour"]
description = "Run every shipped Lua strategy in two real boxes and check it moves, fights, and fires; requires running Compose stack"
depends = ["v4:build", "box:build"]
run = "for s in main scout assault sniper support sentinel scavenger; do echo \"== $s\"; ARENA_SMOKE_SCRIPT=examples/lua-v4/$s.lua ARENA_DOCKER_SMOKE=1 go test ./internal/api -run TestV4DockerSSHSmoke -count=1 -v -timeout=4m | grep -E -- '--- (PASS|FAIL)|travelled|barely' || exit 1; done"
